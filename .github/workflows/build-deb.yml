name: Build and Publish Debian Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PKG_NAME: usermanager

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier le code Bash avec Shellcheck
        run: |
          shellcheck -S warning main.sh
          # Fichiers sourcés par main.sh (sans shebang) : on ne bloque que sur les vraies erreurs
          shellcheck -s bash -S error functions/*.sh

      - name: Extraire le numéro de version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Préparer l'arborescence du paquet
        run: |
          ROOT="build/${PKG_NAME}_${VERSION}_all"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          # main.sh charge ./functions/*.sh en relatif : on garde les deux
          # ensemble dans /usr/lib/<paquet>, et /usr/bin contient un lanceur.
          install -d "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/$PKG_NAME/functions"
          install -m 755 main.sh "$ROOT/usr/lib/$PKG_NAME/main.sh"
          install -m 644 functions/*.sh "$ROOT/usr/lib/$PKG_NAME/functions/"

          cat <<EOF > "$ROOT/usr/bin/$PKG_NAME"
          #!/bin/bash
          cd /usr/lib/$PKG_NAME || exit 1
          exec bash ./main.sh "\$@"
          EOF
          chmod 755 "$ROOT/usr/bin/$PKG_NAME"

      - name: Générer le fichier control
        run: |
          cat <<EOF > "$ROOT/DEBIAN/control"
          Package: $PKG_NAME
          Version: $VERSION
          Section: admin
          Priority: optional
          Architecture: all
          Depends: bash, whiptail, passwd
          Maintainer: Mathis Sauvage <Mathis.sauvage24750@gmail.com>
          Description: Gestion interactive des utilisateurs et groupes
           Menu whiptail pour créer et supprimer des utilisateurs et des
           groupes sur le système.
          EOF

      - name: Construire le paquet .deb
        run: |
          dpkg-deb --root-owner-group --build "$ROOT"
          dpkg-deb --info "$ROOT.deb"

      - name: Sauvegarder le .deb comme artefact (téléchargeable depuis GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-deb
          path: build/*.deb

      - name: Attacher le .deb à la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
